<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Habit Tracker</h1>
      <span id="today-display" class="today"></span>
    </header>

    <form id="add-habit-form">
      <input
        type="text"
        id="habit-name-input"
        placeholder="New habit name..."
        maxlength="80"
        required
        autocomplete="off"
      />
      <button type="submit">Add Habit</button>
    </form>

    <div id="storage-warning" class="storage-warning hidden">
      Storage unavailable — data will not be saved.
    </div>

    <ul id="habit-list" aria-label="Habits"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
